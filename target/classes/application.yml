server:
  port: 8765

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios-service
              uri: lb://USUARIOS-SERVICE
              predicates:
                - Path=/usuarios/**
              filters:
                - StripPrefix=1
            - id: casos-service
              uri: lb://CASOS-SERVICE
              predicates:
                - Path=/casos/**
              filters:
                - StripPrefix=1
            - id: partidas-service
              uri: lb://PARTIDAS-SERVICE
              predicates:
                - Path=/partidas/**
              filters:
                - StripPrefix=1

jwt:
  secret: ${JWT_SECRET:ClaveSuperSecretaParaDesarrolloCambiarEnProduccion123456}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/
