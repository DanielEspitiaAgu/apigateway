server:
  port: 8765

spring:
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        ttl: ${LOADBALANCER_CACHE_TTL:35s}
    gateway:
      server:
        webflux:
          routes:
            - id: usuarios-service
              uri: lb://USUARIOS-SERVICE
              predicates:
                - Path=/usuarios/**
              filters:
                - StripPrefix=1
            - id: casos-service
              uri: lb://CASOS-SERVICE
              predicates:
                - Path=/casos/**
              filters:
                - StripPrefix=1
            - id: partidas-service
              uri: lb://PARTIDAS-SERVICE
              predicates:
                - Path=/partidas/**
              filters:
                - StripPrefix=1

gateway:
  secret: ${GATEWAY_SECRET:}

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/hopedoku}
  jwks-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8080/realms/hopedoku/protocol/openid-connect/certs}
  allowed-azp: ${KEYCLOAK_ALLOWED_AZP:${KEYCLOAK_AUTHORIZED_PARTY:hopedoku-godot}}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:api-gateway}
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
  client:
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8762/eureka/}
